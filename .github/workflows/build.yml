name: Build Capturita

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: Capturita (macOS)
    runs-on: macos-15
    env:
      CAPTURITA_LICENSE_PUBKEY: ${{ vars.CAPTURITA_LICENSE_PUBKEY }}
      CAPTURITA_LICENSE_API_URL: ${{ vars.CAPTURITA_LICENSE_API_URL }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Tool versions
        run: swift --version && rustc --version && node --version

      - run: npm ci

      - name: Check release license configuration
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          test -n "$CAPTURITA_LICENSE_PUBKEY" || { echo "Set the CAPTURITA_LICENSE_PUBKEY repository variable before releasing."; exit 1; }
          test -n "$CAPTURITA_LICENSE_API_URL" || { echo "Set the CAPTURITA_LICENSE_API_URL repository variable before releasing."; exit 1; }

      # The Tauri build first compiles the Swift ScreenCaptureKit helper (npm run build:recorder).
      - name: Build app
        id: build
        continue-on-error: true
        run: npx tauri build --bundles app,dmg

      # hdiutil on GitHub's macOS runners sometimes fails with "Resource busy"; one retry clears it.
      - name: Build app (retry)
        if: steps.build.outcome == 'failure'
        run: npx tauri build --bundles app,dmg

      - uses: actions/upload-artifact@v4
        with:
          name: capturita-macos
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # Installers go to the public downloads repo shared by all apps (PAT with contents:write on it,
      # stored as RELEASES_TOKEN). Tags are per app so the repo can host more.
      - uses: softprops/action-gh-release@v2
        with:
          repository: aryan2621/downloads
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: capturita-${{ github.ref_name }}
          name: Capturita ${{ github.ref_name }}
          files: artifacts/**/*
