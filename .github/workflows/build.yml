name: Build Capturita

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: Capturita (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Tool versions
        run: swift --version && rustc --version && node --version

      - run: npm ci

      # The Tauri build first compiles the Swift ScreenCaptureKit helper (npm run build:recorder).
      - name: Build app
        id: build
        continue-on-error: true
        run: npx tauri build --bundles app,dmg

      # hdiutil on GitHub's macOS runners sometimes fails with "Resource busy"; one retry clears it.
      - name: Build app (retry)
        if: steps.build.outcome == 'failure'
        run: npx tauri build --bundles app,dmg

      - uses: actions/upload-artifact@v4
        with:
          name: capturita-macos
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
